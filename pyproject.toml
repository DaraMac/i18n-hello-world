[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello"
version = "0.0.1"
description = "Translation hello world"
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Source Code" = "https://github.com/DaraMac/translation-test"

[project.scripts]
hello = "hello.hello:hello"
