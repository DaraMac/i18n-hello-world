[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "i18n-hello-world"
version = "0.0.1"
authors = [
    { name="Dara MacConville", email="DaraMac@users.noreply.github.com" },
]
description = "A Hello World program with internationalisation"
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
"Source" = "https://github.com/DaraMac/i18n-hello-world.git"

[project.scripts]
hello = "i18n_hello_world.hello:hello"
